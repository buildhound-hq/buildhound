# Scheduled checks: the cron fires every five minutes (R01) and the job has no timeout (R06).
name: Nightly
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-links.sh # no timeout-minutes on purpose
