name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run coverage
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage.md
