name: Docs

on:
  pull_request:
    paths:
      - "docs/**"

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - name: Build docs
        run: mkdocs build --strict
      - name: Lint markdown
        run: npx markdownlint-cli2 "docs/**/*.md"
