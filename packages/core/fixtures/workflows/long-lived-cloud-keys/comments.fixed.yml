# Nightly backup.
name:   Backup   # spaced

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC

jobs:
  # Copies the bucket.
  backup:
    runs-on:   ubuntu-latest   # hosted
    permissions:
      contents: read   # checkout only
      id-token: write
    steps:
      - name: Log in   # stored keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1   # Ireland
          # the old IAM user
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<ROLE_NAME> # rotate me
          # quoted
      - run: aws s3 sync s3://a s3://b
