name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Build
        run: xcodebuild -scheme App -destination 'platform=iOS Simulator,name=iPhone 16' build
      - name: Test
        run: xcodebuild test -scheme App -destination 'platform=iOS Simulator,name=iPhone 16'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint

  pods:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: pod install
      - run: fastlane beta
