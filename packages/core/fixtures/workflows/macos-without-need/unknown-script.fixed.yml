name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Package
        run: ./scripts/package.sh --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
