name: iOS

on:
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild test -scheme App -destination 'platform=iOS Simulator,name=iPhone 16'
