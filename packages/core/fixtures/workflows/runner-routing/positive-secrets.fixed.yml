# Release lane: signs and uploads to App Store Connect. Uses an environment and secrets, so it is secret-bearing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ vars.BUILDHOUND_MACOS_TRUSTED || 'macos-latest' }}
    environment: app-store   # protection rules and deployment secrets
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload to App Store Connect
        run: bundle exec fastlane release
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
